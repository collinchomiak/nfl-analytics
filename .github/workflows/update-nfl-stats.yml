
name: Update NFL Statistics

on:
  schedule:
    # Daily at 10:00 AM UTC (3:00 AM Arizona time)
    - cron: '0 10 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-stat-updates
  cancel-in-progress: false

jobs:
  update-stats:
    name: Refresh 2026 NFL Data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download latest player statistics
        run: node scripts/updateNFLData.mjs

      - name: Download latest game scores
        run: node scripts/updateNFLScoreData.mjs

      - name: Check production build
        run: npm run build

      - name: Commit updated NFL data
        id: commit_stats
        run: |
          git add \
            src/data/playerStats2026.json \
            src/data/teamScores2026.json

          if git diff --cached --quiet; then
            echo "No NFL data changes. Nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update 2026 NFL statistics and scores"
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Vercel deployment
        if: steps.commit_stats.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Missing VERCEL_DEPLOY_HOOK secret."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 3 \
            --request POST \
            "$VERCEL_DEPLOY_HOOK"

          echo ""
          echo "Vercel deployment requested successfully."
