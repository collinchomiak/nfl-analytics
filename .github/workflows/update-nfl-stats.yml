
name: Update NFL Statistics

on:
  schedule:
    # Every day at 10:00 AM UTC (3:00 AM Arizona time)
    - cron: '0 10 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-stat-updates
  cancel-in-progress: false

jobs:
  update-stats:
    name: Refresh 2026 NFL Data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download latest statistics
        run: node scripts/updateNFLData.mjs

      - name: Check production build
        run: npm run build

      - name: Commit updated statistics
        run: |
          git add src/data/playerStats2026.json

          if git diff --cached --quiet; then
            echo "No statistical changes. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update 2026 NFL player statistics"
          git push
